<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Northstar Dental provides thoughtful, modern dentistry for every stage of life in Portland, Oregon.">
    <meta property="og:title" content="Northstar Dental | A brighter kind of dentistry">
    <meta property="og:description" content="Comfort-first dental care for confident, healthy smiles.">
    <title>{% block title %}Northstar Dental | A brighter kind of dentistry{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { navy: "#172f38", ink: "#22363b", teal: "#86cfc3", mint: "#e8f4ef", cream: "#faf9f4", orange: "#f0a06e" },
            fontFamily: { sans: ["DM Sans", "sans-serif"], display: ["Playfair Display", "serif"] }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons();
        const menu = document.querySelector("[data-menu]");
        const menuButton = document.querySelector("[data-menu-button]");
        menuButton?.addEventListener("click", () => {
          menu.classList.toggle("hidden");
          menuButton.setAttribute("aria-expanded", String(!menu.classList.contains("hidden")));
        });
        document.querySelectorAll("[data-faq-button]").forEach((button) => {
          button.addEventListener("click", () => {
            const answer = document.getElementById(button.dataset.faqButton);
            const isOpen = !answer.classList.contains("hidden");
            document.querySelectorAll("[data-faq-answer]").forEach((item) => item.classList.add("hidden"));
            document.querySelectorAll("[data-faq-button]").forEach((item) => item.setAttribute("aria-expanded", "false"));
            if (!isOpen) {
              answer.classList.remove("hidden");
              button.setAttribute("aria-expanded", "true");
            }
          });
        });
      });
    </script>
  </body>
</html>
